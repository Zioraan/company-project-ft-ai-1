name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/talent-pipeline-tracker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install tracker dependencies
        run: npm ci --prefix apps/talent-pipeline-tracker

      - name: Install website dependencies
        run: npm ci --prefix uis/website

      - name: Install backoffice dependencies
        run: npm ci --prefix uis/backoffice

      - name: Run quality gate
        run: npm run ci
