networks:
  nexova_network:
    name: nexova_network

services:
  ui:
    build:
      context: ./uis
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_INCIDENTS_API_URL: ${NEXT_PUBLIC_INCIDENTS_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:-http://localhost:8000/telemetry/events}
    volumes:
      - ./uis/website:/app/website
      - website_node_modules:/app/website/node_modules
      - ./uis/backoffice:/app/backoffice
      - backoffice_node_modules:/app/backoffice/node_modules
      # Match backoffice relative imports: ../../../services and ../../../src from /app/backoffice/*
      - ./services:/services
      - ./src:/src
    networks:
      - nexova_network

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-http://localhost:8000/telemetry/events}
    volumes:
      - ./services/api:/app
      - backend_data:/app/data
    networks:
      - nexova_network

volumes:
  website_node_modules:
  backoffice_node_modules:
  backend_data:
